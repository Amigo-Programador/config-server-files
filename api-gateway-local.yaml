spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      server:
        webflux:
          routes:
            - id: ms-client-route
              uri: http://localhost:8081
              predicates:
                - Path=/gateway/client/**
              filters:
                - RewritePath=/gateway/client/(?<segment>.*), /client/${segment}
            - id: ms-debitcard-route
              uri: http://localhost:8082
              predicates:
                - Path=/debitcard/**
              filters:
                - AddResponseHeader=X-API, Amigo-Programador-Gateway
server:
  port: 9999